name: Backend CI and deploy

on:
  pull_request:
    paths:
      - node-backend/**
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - node-backend/**
      - .github/workflows/backend.yml

permissions:
  contents: read

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    name: Deploy backend
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Sync backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.BACKEND_PATH }}
        run: >-
          rsync -az
          --exclude='.env'
          --exclude='node_modules'
          -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          node-backend/
          "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install production dependencies and restart API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.BACKEND_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<REMOTE_SCRIPT
          export NVM_DIR="/home/$DEPLOY_USER/.nvm"
          . "\$NVM_DIR/nvm.sh"
          cd "$DEPLOY_PATH"
          npm ci --omit=dev
          if pm2 describe cloud-api >/dev/null 2>&1; then
            pm2 restart cloud-api
          else
            pm2 start server.js --name cloud-api
          fi
          pm2 save
          REMOTE_SCRIPT
